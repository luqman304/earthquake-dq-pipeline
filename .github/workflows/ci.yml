name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DBT_PROFILES_DIR: ${{ github.workspace }}
  INGEST_DAYS: "14"

jobs:
  build:
    name: dbt build (models + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          dbt deps
      - name: Ingest (USGS API -> raw)
        run: python pipeline/ingest.py
      - name: Source freshness
        run: dbt source freshness
      - name: dbt build
        run: dbt build
      - name: Quality report
        if: always()
        run: |
          python scripts/summarize_results.py --title "CI data-quality report" --out quality_report.md
          cat quality_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Generate docs
        run: dbt docs generate --static
      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: |
            target/static_index.html
            target/index.html
            target/manifest.json
            target/catalog.json
            target/sources.json
            quality_report.md
          retention-days: 14

  quality-gates:
    name: quality gates catch injected faults
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          dbt deps
      - name: Ingest with deliberately corrupted rows
        run: python pipeline/ingest.py --inject-faults
      - name: dbt build must fail
        run: |
          if dbt build; then
            echo "::error::dbt build passed even though corrupted rows were loaded"
            exit 1
          fi
      - name: The expected checks flagged the faults
        run: |
          python scripts/summarize_results.py --title "Fault-injection run" --out fault_report.md
          cat fault_report.md >> "$GITHUB_STEP_SUMMARY"
          python scripts/check_fault_run.py
